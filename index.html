    <script>
      // Set theme and language before first paint (no flash). Mirrors src/hooks/usePrefs.js.
      ;(function () {
        var theme = null, lang = null
        try { theme = localStorage.getItem('theme'); lang = localStorage.getItem('lang') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        if (lang === 'hi') document.documentElement.lang = 'hi'
      })()
    </script>
